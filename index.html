<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF9FB">
<title>Tarefas da Casa</title>
<style>
@font-face{font-family:"Cormorant Garamond";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/cormorant-garamond-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Cormorant Garamond";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/cormorant-garamond-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Cormorant Garamond";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/cormorant-garamond-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Cormorant Garamond";font-style:italic;font-weight:500;font-display:swap;src:url(fonts/cormorant-garamond-latin-500-italic.woff2) format("woff2")}
@font-face{font-family:"Cormorant Garamond";font-style:italic;font-weight:600;font-display:swap;src:url(fonts/cormorant-garamond-latin-600-italic.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/nunito-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/nunito-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/nunito-latin-700-normal.woff2) format("woff2")}

:root{padding-top:env(safe-area-inset-top,0px)}
html{-webkit-tap-highlight-color:transparent}
body{margin:0}
[hidden]{display:none!important}

/* Layout: planner de bolso em tons pastéis — uma coluna (máx. 560px), cartões brancos, cada período do dia com sua cor suave, barra inferior com o “+” ao centro */
:root{
  color-scheme:light;
  --bg:#FFF9FB;          /* branco rosado */
  --paper:#FFFFFF;       /* branco */
  --blush:#FDE6EE;       /* rosa pastel */
  --beige:#F5F0F8;       /* branco lilás, fundos neutros */
  --rose:#F3A7BF;        /* rosa do botão */
  --rose-deep:#C25C7E;   /* rosa para textos e destaques */
  --on-rose:#5A2840;     /* texto sobre rosa */
  --yellow:#FFF2C2;      /* amarelo pastel */
  --yellow-deep:#A57C10;
  --lilac:#EEE5FB;       /* lilás pastel */
  --lilac-deep:#8467BF;
  --sky:#DDEEFD;         /* azul pastel */
  --sky-deep:#3F7DB8;
  --sage:#4E9A6C;        /* verde (texto/ícone) */
  --sage-soft:#DDF4E5;   /* verde pastel */
  --ink:#4A4054;         /* texto principal, ameixa suave */
  --muted:#8A8095;
  --line:#F1E6EE;
  --tick:#FFFFFF;
  --shadow:0 1px 2px rgba(190,120,150,.06), 0 8px 22px rgba(190,120,150,.09);
  --scrim:rgba(90,60,90,.28);
  --f-display:"Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --f-body:"Nunito", "Segoe UI", system-ui, sans-serif;
  --r-card:20px; --r-sm:14px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:18px calc(110px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{text-wrap:balance}

/* Cabeçalhos */
.hello h1{font-family:var(--f-display);font-weight:600;font-size:clamp(29px,7.4vw,36px);line-height:1.08;margin:0;letter-spacing:-.005em}
.hello .date{margin:6px 0 0;color:var(--muted);font-size:14px;letter-spacing:.02em}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pagehead h1{font-family:var(--f-display);font-weight:600;font-size:32px;line-height:1.1;margin:0}
.pagehead p{margin:4px 0 0;color:var(--muted);font-size:14px}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* Assistente */
.assist{background:var(--lilac);border-radius:var(--r-card);padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.assist .av{flex:none;width:38px;height:38px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:19px}
.assist p{margin:0;font-size:14.5px}
.assist p b{font-weight:700}

/* Períodos e cartões */
.period{display:flex;flex-direction:column;gap:10px}
.phead{display:flex;align-items:baseline;gap:8px;margin:2px 4px 0}
.phead h2{font-family:var(--f-display);font-size:23px;font-weight:600;margin:0}
.phead .n{color:var(--muted);font-size:13px}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;padding:12px 12px 12px 12px;border:1px solid transparent;transition:opacity .2s, background .2s}
.card .emo{flex:none;width:44px;height:44px;border-radius:14px;background:var(--beige);display:grid;place-items:center;font-size:22px}
.card .cb{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:0;display:flex;flex-direction:column;gap:2px}
.card .nm{font-weight:700;font-size:15.5px;overflow-wrap:anywhere}
.card .mt{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--muted);align-items:center}
.card .tm{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:var(--beige);color:var(--muted)}
.tag.next{background:var(--sage-soft);color:var(--sage)}
.tag.pend{background:var(--blush);color:var(--rose-deep)}
.check{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--paper);display:grid;place-items:center;padding:0;transition:background .15s,border-color .15s}
.check svg{width:16px;height:16px;color:var(--tick);opacity:0}
.check:hover{border-color:var(--rose)}
.card.is-next{border-color:var(--sage)}
.card.done{background:transparent;box-shadow:none;border-color:var(--line);opacity:.62}
.card.done .nm{text-decoration:line-through;text-decoration-color:var(--rose);font-weight:600}
.card.done .emo{background:var(--blush);filter:grayscale(.3)}
.card.done .check{background:var(--rose-deep);border-color:var(--rose-deep)}
.card.done .check svg{opacity:1}
.card.compact{padding:9px 10px;gap:10px;border-radius:14px}
.card.compact .emo{width:34px;height:34px;border-radius:11px;font-size:17px}
.card.compact .check{width:28px;height:28px}

/* Progresso */
.progress{background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px;display:flex;gap:16px;align-items:center}
.ring{flex:none;width:84px;height:84px}
.ring .bgc{stroke:var(--beige)}
.ring .fgc{stroke:var(--rose-deep);transition:stroke-dashoffset .5s ease}
.ring text{fill:var(--ink);font-family:var(--f-display);font-weight:700;font-size:21px}
.progress h3{font-family:var(--f-display);font-size:22px;margin:0;font-weight:600}
.progress p{margin:2px 0 0;color:var(--muted);font-size:14px}
.progress .quote{margin-top:8px;font-family:var(--f-display);font-style:italic;font-size:18px;color:var(--rose-deep)}
.bar{height:8px;border-radius:999px;background:var(--beige);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--lilac-deep));border-radius:999px}

/* Botões */
.btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--rose)}
.btn.primary{background:var(--rose);border-color:var(--rose);color:var(--on-rose)}
.btn.primary:hover{filter:brightness(.96)}
.btn.soft{background:var(--blush);border-color:transparent;color:var(--rose-deep)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-inline:10px}
.btn.danger{background:transparent;border-color:var(--line);color:var(--rose-deep)}
.btn.sm{padding:6px 12px;font-size:13px}
.empty{background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow);padding:22px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty .big{font-size:30px}
.empty p{margin:0}

/* Segmentado */
.seg{display:inline-flex;background:var(--beige);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* Calendário */
.calbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.calnav{display:flex;align-items:center;gap:6px}
.calnav strong{font-family:var(--f-display);font-size:22px;font-weight:600;min-width:0}
.round{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;padding:0;font-size:17px;color:var(--muted)}
.month{background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow);padding:10px}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.mgrid .wh{text-align:center;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;padding:4px 0 6px}
.mday{border:0;background:transparent;border-radius:12px;min-height:58px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.mday .d{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.mday.out{opacity:.35}
.mday.today .d{background:var(--blush);color:var(--rose-deep)}
.mday.sel{background:var(--beige)}
.mday .em{font-size:11px;line-height:1;letter-spacing:-1px;white-space:nowrap;overflow:hidden;max-width:100%}
.mday .dots{display:flex;gap:2px}
.mday .dots i{width:5px;height:5px;border-radius:50%;background:var(--rose)}
.mday .dots i.ok{background:var(--sage)}
.mday .dots i.ok{background:var(--sage)}
@media (max-width:520px){.mday .em{display:none}.mday{min-height:46px}}
.daypanel{display:flex;flex-direction:column;gap:10px}
.daypanel h2{font-family:var(--f-display);font-size:23px;font-weight:600;margin:0 4px}
.weekcol{display:flex;flex-direction:column;gap:12px}
.wday{background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:8px}
.wday.today{box-shadow:0 0 0 2px var(--blush), var(--shadow)}
.wday header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.wday header button{border:0;background:transparent;padding:0;font-family:var(--f-display);font-size:20px;font-weight:600;text-align:left}
.wday header span{font-size:12.5px;color:var(--muted)}
.wrow{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.wrow .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;width:40px;flex:none}
.wrow .n{flex:1;min-width:0;overflow-wrap:anywhere}
.wrow.done .n{text-decoration:line-through;color:var(--muted)}
.mini{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);background:transparent;padding:0;display:grid;place-items:center}
.mini svg{width:11px;height:11px;color:var(--tick);opacity:0}
.wrow.done .mini{background:var(--rose-deep);border-color:var(--rose-deep)}
.wrow.done .mini svg{opacity:1}
.muted{color:var(--muted)}

/* Compras */
.quickadd{display:flex;gap:8px;background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow);padding:8px}
.quickadd input{flex:1;min-width:0;border:0;background:transparent;padding:8px 10px;outline:none}
.nextshop{display:flex;gap:10px;align-items:center;background:var(--sage-soft);border-radius:var(--r-sm);padding:10px 14px;font-size:14px}
.shopsec{display:flex;flex-direction:column;gap:8px}
.shopsec h2{font-family:var(--f-display);font-size:23px;font-weight:600;margin:4px 4px 0;display:flex;gap:8px;align-items:baseline}
.shopsec h2 small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:500}
.shoplist{background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.sitem{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.sitem:first-child{border-top:0}
.sitem .sb{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:0;display:flex;flex-direction:column}
.sitem .sn{font-weight:700;overflow-wrap:anywhere}
.sitem .so{font-size:13px;color:var(--muted);font-style:italic;overflow-wrap:anywhere}
.sitem.bought .sn{text-decoration:line-through;text-decoration-color:var(--sage);color:var(--muted)}
.shead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* Suplementos */
.supp{background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px}
.supp.off{opacity:.6}
.supp .top{display:flex;gap:12px;align-items:center}
.supp .emo{flex:none;width:44px;height:44px;border-radius:14px;background:var(--sage-soft);display:grid;place-items:center;font-size:22px}
.supp .info{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:0}
.supp .nm{font-weight:700;font-size:15.5px}
.supp .mt{font-size:13px;color:var(--muted)}
.supp .note{font-size:13px;color:var(--muted);font-style:italic}
.supp .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;font-size:13.5px}
.daydots{display:flex;gap:3px}
.daydots span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;background:var(--beige);color:var(--muted)}
.daydots span.on{background:var(--sage);color:var(--paper)}

/* Interruptor */
.sw{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;padding:0;font-size:13.5px;color:var(--ink)}
.sw .tr{width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;transition:background .15s;flex:none}
.sw .tr::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.sw[aria-checked="true"] .tr{background:var(--sage)}
.sw[aria-checked="true"] .tr::after{transform:translateX(16px)}

/* Mais */
.menu{display:flex;flex-direction:column;background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.menu button{border:0;border-top:1px solid var(--line);background:transparent;display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:left}
.menu button:first-child{border-top:0}
.menu .mi{width:38px;height:38px;border-radius:12px;background:var(--blush);display:grid;place-items:center;font-size:18px;flex:none}
.menu .mtx{flex:1;min-width:0;display:flex;flex-direction:column}
.menu .mtx b{font-weight:700}
.menu .mtx span{font-size:13px;color:var(--muted)}
.menu .chev{color:var(--muted)}
.back{align-self:flex-start}
.panel{background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-family:var(--f-display);font-size:23px;font-weight:600;margin:0}
.statrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.statrow div{background:var(--bg);border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column}
.statrow b{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.statrow span{font-size:12.5px;color:var(--muted)}
.days7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end}
.days7 .col{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.days7 .stk{width:100%;max-width:28px;height:70px;background:var(--beige);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.days7 .stk i{display:block;width:100%;background:var(--rose);border-radius:8px}
.days7 .stk i.full{background:var(--sage)}
.days7 small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.days7 .col.today small{color:var(--rose-deep)}
.flowers{display:flex;flex-wrap:wrap;gap:6px;font-size:20px}
.flowers span{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:var(--bg)}
.flowers span.empty-d{font-size:12px;color:var(--muted)}
.rlist{display:flex;flex-direction:column}
.ritem{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ritem:first-child{border-top:0}
.ritem .e{font-size:20px;width:30px;text-align:center;flex:none}
.ritem .tx{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:0;display:flex;flex-direction:column}
.ritem .tx b{font-weight:700;overflow-wrap:anywhere}
.ritem .tx span{font-size:12.5px;color:var(--muted)}

/* Barra inferior */
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--paper);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(190,120,150,.08)}
nav.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));align-items:end}
nav.tabbar .tb{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:14px;font-size:10.5px;min-width:0;white-space:nowrap;letter-spacing:-.02em;overflow:hidden;font-weight:700;color:var(--muted)}
nav.tabbar .tb .ic{font-size:20px;line-height:1.2;filter:grayscale(.5);opacity:.8}
nav.tabbar .tb[aria-current="page"]{color:var(--rose-deep)}
nav.tabbar .tb[aria-current="page"] .ic{filter:none;opacity:1}
nav.tabbar .tb[aria-current="page"]::after{content:"";width:18px;height:3px;border-radius:3px;background:var(--rose);margin-top:2px}
.pluswrap{display:flex;justify-content:center;align-items:flex-start;height:52px}
.plus{margin-top:-26px;width:60px;height:60px;border-radius:50%;border:4px solid var(--bg);background:var(--rose);color:var(--on-rose);font-size:30px;line-height:1;display:grid;place-items:center;box-shadow:0 6px 18px rgba(220,120,160,.35);padding:0}
.plus:hover{filter:brightness(.95)}

/* Folha (formulários) */
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding-top:24px}
@media (min-width:640px){.overlay{align-items:center;padding:24px}}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:100%;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.sheet{border-radius:24px}}
.sheet .grab{width:42px;height:4px;border-radius:4px;background:var(--line);align-self:center;margin-top:-8px}
.sheet h2{font-family:var(--f-display);font-size:27px;font-weight:600;margin:0}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label,.fld>.lb{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:var(--r-sm);padding:10px 12px;min-width:0}
.inp:focus{outline:none;border-color:var(--rose)}
textarea.inp{resize:vertical;min-height:62px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:400px){.grid2{grid-template-columns:1fr}}
.emobtn{width:52px;height:52px;border-radius:16px;border:1px solid var(--line);background:var(--paper);font-size:26px;padding:0;flex:none}
.namerow{display:flex;gap:10px;align-items:flex-end}
.namerow .fld{flex:1}
.emogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;background:var(--paper);border-radius:var(--r-sm);padding:8px;border:1px solid var(--line)}
.emogrid button{border:0;background:transparent;font-size:22px;height:42px;border-radius:10px;padding:0}
.emogrid button:hover,.emogrid button[aria-pressed="true"]{background:var(--blush)}

          el("div", { class: "inline" },
            el("button", { class: "btn ghost sm", type: "button", onclick: () => { d.days = [1, 2, 3, 4, 5]; draw(); } }, "Seg a sex"),
            el("button", { class: "btn ghost sm", type: "button", onclick: () => { d.days = [0, 1, 2, 3, 4, 5, 6]; draw(); } }, "Todos os dias"))),
        el("div", { class: "fld" }, el("label", { for: "s-note" }, "Observação"), el("textarea", { class: "inp", id: "s-note", rows: "2", placeholder: "Ex.: tomar depois do café", oninput: e => d.note = e.target.value }, d.note || "")),
        sw("Lembrete no horário", d.remind !== false, v => d.remind = v, "s-remind"),
        sw("Ativo", d.active !== false, v => d.active = v, "s-active"),
        err,
        el("div", { class: "actions" },
          isNew ? null : delButton("Excluir", () => { saveSupps(S.supps.filter(x => x.id !== d.id)); close(); toast("Suplemento excluído"); }),
          el("div", { class: "r" }, el("button", { class: "btn", type: "button", onclick: close }, "Cancelar"), el("button", { class: "btn primary", type: "button", onclick: save }, "Salvar"))));
    }
    function save() {
      d.name = (d.name || "").trim();
      if (!d.name) { err.textContent = "Dê um nome para o suplemento."; return; }
      if (!d.days.length) { err.textContent = "Escolha pelo menos um dia."; return; }
      saveSupps(isNew ? [...S.supps, d] : S.supps.map(x => x.id === d.id ? d : x));
      close(); toast(isNew ? `${d.emoji} ${d.name} adicionado` : "Alterações salvas 🌷");
    }
    draw();
  });
}

function openShopItem(p) {

          } }, "Salvar"))));

/* ===================== Lembretes ===================== */
const fired = new Set(); const snoozed = {};
let audioCtx = null;
function chime() {
  if (!ui.interacted || settings().sound === false) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime;
    [[784, 0], [1047, 0.18]].forEach(([f, dt]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0, t0 + dt); g.gain.linearRampToValueAtTime(0.12, t0 + dt + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.9);
      o.connect(g); g.connect(audioCtx.destination); o.start(t0 + dt); o.stop(t0 + dt + 1);
    });
  } catch {}
}
function remTitle(it) { return it.kind === "s" ? "🔔 Hora do suplemento!" : `🔔 Hora de ${it.name.charAt(0).toLowerCase() + it.name.slice(1)}!`; }
function showReminder(it) {
  const root = $("#remRoot");
  const close = () => root.replaceChildren();
  root.replaceChildren(el("div", { class: "reminder", role: "alertdialog", "aria-label": remTitle(it) },
    el("p", { class: "rt" }, remTitle(it)),
    el("div", { class: "rb" }, el("span", { class: "e", "aria-hidden": "true" }, it.emoji), el("div", {}, el("b", {}, it.name), el("div", { class: "muted", style: "font-size:13.5px" }, it.time))),
    el("div", { class: "ra" },
      el("button", { class: "btn ghost sm", type: "button", onclick: close }, "Fechar"),
      el("button", { class: "btn sm", type: "button", onclick: () => { snoozed[it.key] = toMin(nowHM()) + 10; close(); toast("Lembro de novo em 10 minutos"); } }, "Daqui a 10 min"),
      el("button", { class: "btn primary sm", type: "button", onclick: () => { if (!isDone(it)) toggle(it); close(); } }, "Concluir"))));
  chime();
  try { if (typeof Notification !== "undefined" && Notification.permission === "granted") new Notification(remTitle(it), { body: `${it.emoji} ${it.name} · ${it.time}` }); } catch {}
}
function tick() {
  if (CAP || !S.settings || settings().notif === false) return;
  const td = today(), nm = toMin(nowHM()), lead = settings().lead || 0;
  for (const it of itemsFor(td)) {
    if (!it.remind || !it.time || isDone(it)) continue;
    const at = snoozed[it.key] != null ? snoozed[it.key] : toMin(it.time) - lead;
    const k = it.key + "@" + at;
    if (nm >= at && nm <= at + 2 && !fired.has(k)) { fired.add(k); showReminder(it); break; }
  }
}

/* ===================== Android: notificações e botão voltar ===================== */
const Native = {
  timer: null, perm: null, exact: null,
  reschedule() { if (!CAP) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.run().catch(() => {}), 1200); },
  async ensureChannel() {
    const LN = NP("LocalNotifications"); if (!LN || this._ch) return; this._ch = true;
    try { await LN.createChannel({ id: "lembretes", name: "Lembretes da casa", description: "Avisos no horário das tarefas", importance: 5, visibility: 1, vibration: true, lights: true, lightColor: "#F3A7BF" }); } catch (e) {}
  },
  async status() {
    const LN = NP("LocalNotifications"); if (!LN) return;
    try { this.perm = (await LN.checkPermissions()).display; } catch (e) {}
    try { this.exact = (await LN.checkExactNotificationSetting()).exact_alarm; } catch (e) { this.exact = null; }
  },
  async ask() {
    const LN = NP("LocalNotifications"); if (!LN) return;
    try { this.perm = (await LN.requestPermissions()).display; } catch (e) {}
    this.reschedule(); schedule();
  },
  async askExact() {
    const LN = NP("LocalNotifications"); if (!LN) return;
    try { this.exact = (await LN.changeExactNotificationSetting()).exact_alarm; } catch (e) {}
    this.reschedule(); schedule();
  },
  async run() {
    const LN = NP("LocalNotifications"); if (!LN || !S.settings) return;
    await this.ensureChannel();
    try { const p = await LN.getPending(); if (p && p.notifications && p.notifications.length) await LN.cancel({ notifications: p.notifications.map(n => ({ id: n.id })) }); } catch (e) {}
    if (settings().notif === false) return;
    const lead = settings().lead || 0, now = Date.now(), list = [];
    for (let i = 0; i < 14 && list.length < 300; i++) {
      const d = addDays(today(), i);
      for (const it of itemsFor(d)) {
        if (!it.remind || !it.time || isDone(it)) continue;
        const [y, m, dd] = d.split("-").map(Number); const mins = toMin(it.time) - lead;
        const at = new Date(y, m - 1, dd, 0, 0, 0); at.setMinutes(mins);
        if (at.getTime() <= now + 5000) continue;
        list.push({ id: list.length + 1, title: remTitle(it), body: `${it.emoji} ${it.name} · ${it.time}`, channelId: "lembretes", schedule: { at: at.toISOString(), allowWhileIdle: true }, extra: { key: it.key } });
      }
    }
    if (list.length) { try { await LN.schedule({ notifications: list }); } catch (e) {} }
  },
  init() {
    if (!CAP) return;
    const A = NP("App");
    if (A) {
      A.addListener("backButton", () => {
        if (sheetClose) { sheetClose(); return; }
        if (ui.tab === "mais" && ui.more !== "menu") { ui.more = "menu"; render(); return; }
        if (ui.tab !== "inicio") { ui.tab = "inicio"; render(); window.scrollTo(0, 0); return; }
        A.exitApp();
      });
      A.addListener("resume", () => { ui.lastDay = today(); store.ensureLogs(); render(); this.status().then(schedule); this.reschedule(); });
    }
    this.status().then(() => { if (this.perm && this.perm !== "granted" && this.perm !== "denied") this.ask(); schedule(); });
    this.reschedule();
  }
};

/* ===================== Renderização ===================== */
let raf = 0;
function schedule() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); }
const allReady = () => ready.tasks && ready.supps && ready.shop && ready.settings;
function render() {
  const app = $("#app");
  // preserva o que estiver sendo digitado
  const act = document.activeElement && app.contains(document.activeElement) ? document.activeElement.id : null;
  const vals = {}; app.querySelectorAll("input[id],textarea[id]").forEach(i => { if (i.value) vals[i.id] = i.value; });
  document.querySelectorAll("nav.tabbar .tb").forEach(b => b.toggleAttribute("aria-current", false) || (b.dataset.tab === ui.tab && b.setAttribute("aria-current", "page")));
  const nav = document.querySelector("nav.tabbar");
  if (!allReady()) { app.replaceChildren(el("div", { class: "loading" }, "Abrindo sua agenda…")); nav.hidden = true; return; }
  if (!S.settings) { app.replaceChildren(...viewWelcome()); nav.hidden = true; return; }
  nav.hidden = false;
  const v = ui.tab === "calendario" ? viewCal() : ui.tab === "compras" ? viewShop() : ui.tab === "suplementos" ? viewSupps() : ui.tab === "mais" ? viewMore() : viewHome();
  app.replaceChildren(...[v].flat(3).filter(Boolean));
  for (const [id, val] of Object.entries(vals)) { const i = document.getElementById(id); if (i && app.contains(i) && !i.value) i.value = val; }
  if (act) { const a = document.getElementById(act); if (a) { a.focus(); try { a.setSelectionRange(a.value.length, a.value.length); } catch {} } }
}

document.querySelectorAll("nav.tabbar .tb").forEach(b => b.addEventListener("click", () => {
  ui.tab = b.dataset.tab; if (ui.tab === "mais") ui.more = "menu";
  if (ui.tab === "calendario") { ui.cal.sel = today(); ui.cal.cur = today(); }
  render(); window.scrollTo(0, 0);
}));
$("#plusBtn").addEventListener("click", () => openTask(null, ui.tab === "calendario" ? { date: ui.cal.sel } : null));
document.addEventListener("pointerdown", () => { ui.interacted = true; }, { once: true });
document.addEventListener("keydown", () => { ui.interacted = true; }, { once: true });
setInterval(() => {
  const td = today();
  if (td !== ui.lastDay) { ui.lastDay = td; store.ensureLogs(); }
  tick();
  const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (!typing && !sheetClose && (ui.tab === "inicio" || ui.tab === "calendario")) render();
}, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { tick(); schedule(); } });

render();
store.init().then(() => { Native.init(); setTimeout(tick, 1500); });
})();
